[project]
name = "tw-action"
version = "0.1.0"
description = "action-core for tinker + wink: typed actions, trajectories, limits"
requires-python = ">=3.11"
dependencies = ["tw-scene"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tw_action"]
