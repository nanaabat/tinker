[project]
name = "tw-contracts"
version = "0.1.0"
description = "tinker + wink shared contracts (JSON Schema, generated types, migrations)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tw_contracts"]

[tool.setuptools.package-data]
tw_contracts = ["schemas/*.json", "py.typed"]
