[project]
name = "tw-sim"
version = "0.1.0"
description = "headless deterministic MuJoCo simulation for tinker trajectories"
requires-python = ">=3.11"
dependencies = ["tw-scene", "tw-action", "mujoco>=3.1", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tw_sim"]
