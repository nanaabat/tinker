[project]
name = "tw-fixtures"
version = "0.1.0"
description = "parametric test fixtures (room, wall, window, blind, sliding panel)"
requires-python = ">=3.11"
dependencies = ["tw-scene"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tw_fixtures"]
