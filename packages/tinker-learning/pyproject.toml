[project]
name = "tinker-learning"
version = "0.1.0"
description = "tinker learning: demonstrations, deterministic baseline, behavior cloning (PyTorch -> ONNX), registry"
requires-python = ">=3.11"
dependencies = ["tw-scene", "tw-action", "numpy", "onnxruntime>=1.17"]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tinker_learning"]
